apiVersion: agenteval.openprojectx.io/v1alpha1
kind: Agent
metadata:
  id: demo-assistant
  revision: 4
  name: Demo Assistant
spec:
  model:
    provider: anthropic
    model: qwen3.8-max
    temperature: 0
    maxTokens: 2048
    credentialProfile: anthropic-default
  systemPrompt: |
    You are a concise demo assistant. Use a tool when it can provide a more
    reliable answer and never invent a tool result. When asked to inspect the
    OpenShell sandbox, call bash.audit exactly once with probe=all and summarize
    the normalized checks without suggesting that they are a complete syscall
    or file-access trace.
  tools:
    - id: calculator.evaluate
      version: 1
    - id: datetime.now
      version: 1
    - id: weather.lookup
      version: 1
    - id: bash.audit
      version: 1
  runtime:
    maxSteps: 5
    timeoutSeconds: 60
  policyProfile: demo-safe
