apiVersion: agenteval.openprojectx.io/v1alpha1
kind: Tool
metadata:
  id: bash.execute
  version: 1
  name: Governed arbitrary Bash
spec:
  type: builtin
  handler: builtin.bash_execute
  description: Execute an arbitrary multiline Bash script inside the governed OpenShell runner and return bounded output and exit metadata.
  inputSchema:
    type: object
    additionalProperties: false
    properties:
      script:
        type: string
        minLength: 1
        maxLength: 32768
        description: Arbitrary Bash source executed without loading shell profiles.
      timeoutSeconds:
        type: integer
        minimum: 1
        maximum: 30
        default: 10
    required: [script]
  risk: destructive
  evaluation:
    mode: deterministic
