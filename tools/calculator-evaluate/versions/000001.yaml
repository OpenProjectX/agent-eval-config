apiVersion: agenteval.openprojectx.io/v1alpha1
kind: Tool
metadata:
  id: calculator.evaluate
  version: 1
  name: Calculator
spec:
  type: builtin
  handler: builtin.calculator
  description: Evaluate a basic arithmetic expression.
  inputSchema:
    type: object
    additionalProperties: false
    properties:
      expression:
        type: string
    required: [expression]
  risk: read
  evaluation:
    mode: deterministic
